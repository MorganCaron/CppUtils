changelog:
  categories:
    - title: "⚠️ Breaking Changes"
      labels:
        - "breaking"
    - title: "🚀 New Features"
      labels:
        - "feature"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
    - title: "📝 Documentation"
      labels:
        - "documentation"
    - title: "🛠 Refactoring & CI"
      labels:
        - "refactoring"
        - "ci"
    - title: "🔍 Other Changes"
      labels:
        - "*"
  exclude:
    labels:
      - "duplicate"
      - "invalid"
      - "question"
      - "wontfix"

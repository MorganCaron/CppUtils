name: "CD: Release"

# The Git tag is the single source of truth for the version.
# Run this workflow manually (Actions -> "CD: Release" -> Run workflow) to publish a version.
# No commit is created: the tag is created by this workflow on the current head of master.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (Semantic Versioning, e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: "release"
  cancel-in-progress: false

jobs:
  check:
    name: "Check release parameters"
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Ensure the workflow runs from master
        if: github.ref != 'refs/heads/master'
        run: |
          echo "::error::Releases can only be published from the master branch (current: ${GITHUB_REF})."
          exit 1

      - name: Validate version and tag availability
        id: meta
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${INPUT_VERSION#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${VERSION}' is not a valid Semantic Version (expected X.Y.Z)."
            exit 1
          fi
          TAG="v${VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" > /dev/null 2>&1; then
            echo "::error::Tag ${TAG} already exists."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  ci-linux:
    name: "CI Linux"
    needs: check
    # Called workflows cannot request more permissions than their caller grants.
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/ci-cpp-linux.yml

  ci-macos:
    name: "CI MacOS"
    needs: check
    # Called workflows cannot request more permissions than their caller grants.
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/ci-cpp-macos.yml

  ci-windows:
    name: "CI Windows"
    needs: check
    # Called workflows cannot request more permissions than their caller grants.
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    uses: ./.github/workflows/ci-cpp-windows.yml

  release:
    name: "Create tag and GitHub Release"
    needs: [check, ci-linux, ci-macos, ci-windows]
    runs-on: ubuntu-latest
    # Requires the manual approval configured on the "release" environment.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false

  update-xmake-repo:
    name: "Update xmake-repo"
    needs: [check, release]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check XMAKE_REPO_TOKEN availability
        id: token-check
        run: |
          if [ -z "${{ secrets.XMAKE_REPO_TOKEN }}" ]; then
            echo "::warning::Secret XMAKE_REPO_TOKEN is not configured. Skipping automatic xmake-repo update."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download release tarball and compute SHA-256
        if: steps.token-check.outputs.available == 'true'
        id: checksum
        run: |
          TARBALL_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${{ needs.check.outputs.tag }}.tar.gz"
          echo "Downloading archive from ${TARBALL_URL}..."
          curl -f -sSL "${TARBALL_URL}" -o "archive.tar.gz"
          SHA256=$(sha256sum "archive.tar.gz" | awk '{print $1}')
          if [ -z "$SHA256" ] || [ ${#SHA256} -ne 64 ]; then
            echo "::error::Failed to compute valid SHA-256 checksum for ${TARBALL_URL}"
            exit 1
          fi
          echo "Computed SHA-256: ${SHA256}"
          echo "sha256=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Checkout xmake-repo
        if: steps.token-check.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: "MorganCaron/xmake-repo"
          token: ${{ secrets.XMAKE_REPO_TOKEN }}
          path: "xmake-repo"

      - name: Update package in xmake-repo
        if: steps.token-check.outputs.available == 'true'
        run: |
          python3 - << 'EOF'
          import re

          pkg_file = "xmake-repo/packages/c/cpputils/xmake.lua"
          tag = "${{ needs.check.outputs.tag }}"
          sha256 = "${{ steps.checksum.outputs.sha256 }}"

          with open(pkg_file, "r") as file_handle:
              content = file_handle.read()

          version_entry = f'\tadd_versions("{tag}", "{sha256}")\n'

          if re.search(rf'add_versions\(\s*"{re.escape(tag)}"', content):
              print(f"Version {tag} already present. Updating checksum...")
              content = re.sub(
                  rf'(\tadd_versions\(\s*"{re.escape(tag)}"\s*,\s*)"[^"]*"(\))',
                  lambda match: f'{match.group(1)}"{sha256}"{match.group(2)}',
                  content
              )
          else:
              if "add_versions(" in content:
                  content = re.sub(r'(\tadd_versions\()', version_entry + r'\1', content, count=1)
              else:
                  content = re.sub(r'(\ton_install\()', version_entry + r'\n\1', content, count=1)

          with open(pkg_file, "w") as file_handle:
              file_handle.write(content)
          EOF

      - name: Commit and push changes to xmake-repo
        if: steps.token-check.outputs.available == 'true'
        working-directory: "xmake-repo"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/c/cpputils/xmake.lua
          if git diff --staged --quiet; then
            echo "No changes to commit in xmake-repo."
          else
            git commit -m "add CppUtils ${{ needs.check.outputs.tag }}"
            git push origin master
          fi


name: "CI C++: Windows"

on:
  workflow_call:
  push:
    branches:
      - master
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Windows (${{ matrix.compiler.name }})
    runs-on: windows-latest
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        compiler:
        - {
          name: "Clang",
          cc: "clang",
          cxx: "clang++",
          xmake-toolchain: "--toolchain=llvm --sdk=\"$env:LLVM_PATH\""
        }
    steps:
    - uses: actions/checkout@v7
    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        # Workaround for https://github.com/xmake-io/xmake/issues/7917 (restore branch@master once fixed)
        xmake-version: latest

    - name: Install LLVM
      uses: KyleMayes/install-llvm-action@master
      with:
        version: "22.1.8"
        # Workaround for https://github.com/KyleMayes/install-llvm-action/issues/102 (remove force-url once supported)
        force-url: "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe"

    - name: Configure & Install dependencies
      shell: pwsh
      env:
        CC: ${{ matrix.compiler.cc }}
        CXX: ${{ matrix.compiler.cxx }}
      run: |
        xmake f ${{ matrix.compiler.xmake-toolchain }} --runtimes="c++_shared" --enable_tests=y -v --yes

    - name: Build
      shell: pwsh
      run: |
        xmake build -v

    - name: Run tests
      shell: pwsh
      run: |
        xmake run CppUtils-UnitTests --report=junit:build/test-results.xml

    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action/windows@v2
      if: always()
      with:
        files: "**/test-results.xml"

